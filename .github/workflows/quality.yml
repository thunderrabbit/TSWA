name: Quality

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download ktlint and detekt (versions pinned)
        run: |
          curl -sSLO https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          curl -sSL -o detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar

      - name: ktlint (style)
        run: ./ktlint --relative 'app/src/main/java/**/*.kt'

      - name: detekt (static analysis)
        run: java -jar detekt-cli.jar --config detekt.yml --input app/src/main/java

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest
