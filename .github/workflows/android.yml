name: Android

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Note whether signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tswa-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tswa-release.jks"

      - name: Verify release keystore opens
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_ALIAS: ${{ secrets.TSWA_KEY_ALIAS }}
        run: |
          PW=$(printf '%s' "$TSWA_KEYSTORE_PASSWORD" | tr -d '\r\n')
          keytool -list -keystore "$RUNNER_TEMP/tswa-release.jks" -storepass "$PW"

      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          TSWA_KEYSTORE_PATH: ${{ runner.temp }}/tswa-release.jks
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_ALIAS: ${{ secrets.TSWA_KEY_ALIAS }}
          TSWA_KEY_PASSWORD: ${{ secrets.TSWA_KEY_PASSWORD }}
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build-release.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "Release build failed; publishing the error extract as an annotation."
            MSG=$( (grep -m1 -A5 "What went wrong" build-release.log || tail -25 build-release.log) | sed -e 's/\x1b\[[0-9;]*m//g' | head -c 900 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build failure::$MSG"
            exit $code
          fi

      - name: Upload release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tswa-release
          path: app/build/outputs/apk/release/app-release.apk
