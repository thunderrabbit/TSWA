name: Android

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Work out the version
        run: |
          VERSION=$(grep -oP 'val tswaBaseVersionName = "\K[^"]+' app/build.gradle.kts)
          FULL="${VERSION}.${{ github.run_number }}"
          echo "APP_VERSION_FULL=$FULL" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Note whether signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tswa-release.jks"

      - name: Verify release keystore opens
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_ALIAS: ${{ secrets.TSWA_KEY_ALIAS }}
        run: |
          PW=$(printf '%s' "$TSWA_KEYSTORE_PASSWORD" | tr -d '\r\n')
          keytool -list -keystore "$RUNNER_TEMP/tswa-release.jks" -storepass "$PW" | tee /tmp/kslist.txt
          FOUND=$(awk -F, '/PrivateKeyEntry/ {print $1; exit}' /tmp/kslist.txt)
          echo "::notice title=Keystore alias::The decoded keystore holds its key under the alias: $FOUND"
          echo "TSWA_KEY_ALIAS=$FOUND" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          TSWA_KEYSTORE_PATH: ${{ runner.temp }}/tswa-release.jks
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_PASSWORD: ${{ secrets.TSWA_KEY_PASSWORD }}
        run: |
          set +e
          gradle :app:assembleRelease -PtswaVersionCode=${{ github.run_number }} -PtswaVersionName=${{ env.APP_VERSION_FULL }} --stacktrace 2>&1 | tee build-release.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "Release build failed; publishing the error extract as an annotation."
            MSG=$( (grep -m1 -A5 "What went wrong" build-release.log || tail -25 build-release.log) | sed -e 's/\x1b\[[0-9;]*m//g' | head -c 900 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build failure::$MSG"
            exit $code
          fi

      - name: Upload release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tswa-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION_FULL}"
          FILES="app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "TSWA $TAG" \
              --notes "Automated build of TSWA (Tri-Scale Weather App) from commit ${{ github.sha }}. Install app-release.apk - the signed release build. Every release is signed with the same TSWA key, so releases always install over the top of earlier releases."
          fi
          echo "::notice title=GitHub Release::Published TSWA $TAG"
