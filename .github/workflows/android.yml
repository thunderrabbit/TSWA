name: Android

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tswa-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ secrets.TSWA_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tswa-release.jks"

      - name: Build signed release APK
        if: ${{ secrets.TSWA_KEYSTORE_BASE64 != '' }}
        env:
          TSWA_KEYSTORE_PATH: ${{ runner.temp }}/tswa-release.jks
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_ALIAS: ${{ secrets.TSWA_KEY_ALIAS }}
          TSWA_KEY_PASSWORD: ${{ secrets.TSWA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ secrets.TSWA_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tswa-release
          path: app/build/outputs/apk/release/app-release.apk
