name: Android

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Note whether signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tswa-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TSWA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tswa-release.jks"

      - name: Verify release keystore opens
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_ALIAS: ${{ secrets.TSWA_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/tswa-release.jks" \
            -storepass "$TSWA_KEYSTORE_PASSWORD" -alias "$TSWA_KEY_ALIAS"

      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          TSWA_KEYSTORE_PATH: ${{ runner.temp }}/tswa-release.jks
          TSWA_KEYSTORE_PASSWORD: ${{ secrets.TSWA_KEYSTORE_PASSWORD }}
          TSWA_KEY_ALIAS: ${{ secrets.TSWA_KEY_ALIAS }}
          TSWA_KEY_PASSWORD: ${{ secrets.TSWA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tswa-release
          path: app/build/outputs/apk/release/app-release.apk
